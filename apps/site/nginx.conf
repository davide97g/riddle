# The landing page: static files, compressed, cached by name, and nothing
# else. Cloudflare terminates TLS in front of it, so this listens on plain 80.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Assets are not fingerprinted, so a day rather than a year: a fix to the
    # script reaches everyone by tomorrow without a build step to rename it.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/headers.inc;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers.inc;
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
