# The demo server: RIDDLE_DEMO=1, no tablet, no ssh key anywhere in it. This is
# the one App Review signs in to, and anybody else you want to show the app to
# without lending them your notebook. On the author's homelab it is a Dokploy
# compose app like apps/site, published on the Cloudflare tunnel as
# riddle-demo.davideghiotto.it -> Traefik -> this container's 8765.
#
# The secrets come from Dokploy's environment tab, never from this file:
#   RIDDLE_WEB_PASSWORD   the password handed to App Review in the review notes
#   RIDDLE_OPENAI_KEY     the diary's replies
#   RIDDLE_OPENAI_URL     and where they come from. On the homelab that is the
#   RIDDLE_OPENAI_MODEL   box's own LiteLLM (http://litellm:4000/v1, qwen3.6),
#                         reached over its docker network below, with a key of
#                         its own: free, and no stranger's message costs money.
#                         An OpenAI key instead is these three lines changed.
services:
  riddle-demo:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      RIDDLE_DEMO: "1"
      RIDDLE_WEB_PASSWORD: ${RIDDLE_WEB_PASSWORD:?set it in Dokploy}
      RIDDLE_OPENAI_KEY: ${RIDDLE_OPENAI_KEY:-}
      RIDDLE_OPENAI_URL: ${RIDDLE_OPENAI_URL:-https://api.openai.com/v1}
      RIDDLE_OPENAI_MODEL: ${RIDDLE_OPENAI_MODEL:-gpt-4.1-mini}
      # Nothing to read and nobody's room to keep: recordings go after a day.
      RIDDLE_AUDIO_KEEP_DAYS: "1"
      RM2_SSH_HOST: no-tablet.invalid
    volumes:
      - riddle-demo-data:/data
    networks: [dokploy-network, local-ai]

volumes:
  riddle-demo-data:

networks:
  dokploy-network:
    external: true
  # The box's LiteLLM, by its container name. Homelab-specific, like the
  # rest of this file; drop it with an OpenAI key.
  local-ai:
    external: true
    name: local-ai-uurnqn_default
